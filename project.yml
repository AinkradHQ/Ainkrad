name: Ainkrad
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Sign with a stable identity so macOS TCC (privacy/folder-access) grants
    # persist — an ad-hoc/unsigned app has no designated requirement for the
    # system to attach a saved grant to, so it re-prompts on every access.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    # RT9AA68C38 -- read from the Developer ID Application certificate that
    # actually signs releases ("Developer ID Application: ULINK sp. z o.o.
    # (RT9AA68C38)"). This was PSY67XNHG4, which no longer has a signing
    # identity on this machine; a release signed under a team the cert does not
    # belong to cannot be notarized, and notarytool needs --team-id to match.
    DEVELOPMENT_TEAM: RT9AA68C38
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    # NOTE: Release deliberately does NOT override the identity above.
    #
    # An earlier pass set Release to ad-hoc ("-") on the grounds that forcing
    # "Apple Development" made the pre-sign artifact dishonest — `codesign -d`
    # on it told you nothing about what would actually ship. That reasoning was
    # right and the change was still wrong: it defeats the comment above.
    # An ad-hoc binary has no designated requirement, so macOS cannot attach a
    # saved Keychain/TCC grant to it. A locally-built Release then blocks on
    # `KeychainSecretStore.secret(for:)` during bootstrap and never opens a
    # window. (Found by profiling a Release build — it launched to 0% CPU with
    # no window, and the sample pointed straight at the Keychain read.)
    #
    # Honesty about the pre-sign state is handled where it belongs instead:
    # `scripts/release.sh` re-signs with the Developer-ID identity and then
    # VERIFIES the resulting signature carries the library-validation
    # entitlement, failing the build if it does not.

packages:
  # AinkradAppKit — the Built-in App SDK (github.com/AinkradHQ/AinkradAppKit).
  # DYNAMIC library: the host embeds one copy; plugin bundles resolve it at
  # runtime (a static copy per binary would break dynamic protocol casts).
  AinkradAppKit:
    url: https://github.com/AinkradHQ/AinkradAppKit
    # Apps-over-MCP: AinkradAppMCP + MCPAppServer (PR #18) and the per-tool
    # `requiresLiveApp` flag (PR #20), plus resource `purpose`/`resultProvider`
    # (feat/resource-description-and-errors). Always a merge commit on
    # development, never a feature-branch SHA.
    #
    # KEEP THIS AT OR AHEAD OF EVERY PLUGIN'S PIN. The host embeds the one
    # dynamic copy of the SDK; a plugin built against a NEWER revision links
    # symbols this copy does not define and dies at `Bundle.load()` with no
    # hint as to why. Terminal hit exactly that: same generation (8), newer
    # revision, missing `MCPResourceSpec.requiresLiveApp` setter.
    # Settings catalog: SettingsPath, the SettingsCatalog descriptor types, the
    # SettingsRow/Group/Page primitives, and the optional
    # AinkradApp.settingsCatalog(host:) contract (merge of feat/settings-catalog).
    # Settings composes the kit: AinkradFormRow slots + centred control,
    # AinkradDisclosureGroup, SearchField focus binding, CommandMenu detail/
    # value/keys, SettingsRow/GroupView/PageView composition and page tabs
    # (merge of feat/settings-kit-composition).
    # Settings panes: AinkradSettingsPanel + AinkradCaptionedRow, the wizard's
    # group idiom shared with Settings (merge of feat/settings-panel-component).
    # Context menu: the catcher moved from the background to a hit-test-aware
    # overlay so a right-click lands on rows that draw interactive content, plus
    # AinkradMenuItem.shortcut rendering an AinkradKbd keycap (PR #26), and
    # AinkradPanel gaining a `blending` parameter so a panel hosted in its own
    # NSPanel can sample .behindWindow instead of rendering as a flat slab
    # (PR #27). Default unchanged, so no existing surface moves.
    # AinkradSignal target: the event envelope, kind validation, the pure
    # routing function and the SQLite+FTS5 event store (Signal M1 Tasks 1-6),
    # plus the umbrella re-export that makes the module reachable by
    # consumers at all. A new TARGET, not a renamed symbol - the API
    # generation stays 8 and every existing plugin pin remains loadable.
    # Generation 9: HostServices.signals + PluginSignalEmitter, and the Signal
    # feed components moved into the UI kit. minSupportedAPIVersion is 8, so
    # every installed generation-8 bundle keeps loading.
    # M3: SignalWire — the external wire payload, which carries a token and
    # deliberately no source, plus the SignalAction decoder fix that stops a
    # partial action object from sinking a whole notification as "malformed"
    # (merge of feat/signal-wire-format). Still generation 9: additive only,
    # abi-check clean on both AinkradAppKitContract and AinkradSignal.
    # M3: SignalSocketPath + SignalSocketClient — the socket path convention
    # and the connect-write-close, shared with `ainkrad notify` so the CLI
    # cannot drift from what the host's listener accepts (merge of
    # feat/signal-socket-client).
    # Generation 10: SignalSubscription + PluginSignalObserver (declared
    # cross-app read, user-approved at install), PluginInfoKey
    # .signalSubscriptions, and SignalDeepLink.locator + the
    # ainkradPaneLocator environment sink for pane-level deep-link focus.
    #
    # minSupportedAPIVersion is apiVersion - 2 here, NOT - 1: every plugin
    # bundle installed in the field is still generation 8, so a floor of 9
    # would have launched this host with none of the user's apps.
    # Plus SignalSubscription.kindDescription / builtInSourceName, so the
    # consent prompt can say "Raven" rather than "raven".
    # Plus AinkradAppSignalObserving — the static factory the host casts to,
    # without which PluginSignalObserver was unreachable.
    # M4 Phase 1: SignalStore.event(id:) — the single-row lookup a clicked
    # macOS banner needs, since its userInfo carries an id and nothing else —
    # and RoutingRules.urgentBypass, with Focus now suppressing toast and sound
    # rather than only the banner. Both additive; abi-check clean. Generation
    # unchanged at 10: nothing here is plugin-facing.
    # M4 Phase 2: SuppressionWindow (quiet hours + snooze), RoutingRules
    # .interruptFloor / .soundOverride / .suppression, route(_:rules:context:now:)
    # as an OVERLOAD keeping the old symbol, and SignalStore.kindActivity for the
    # per-kind control rows. All additive; abi-check clean; generation still 10.
    # M4: SignalFeedRow/SignalFeedList gain a `menuItems` closure (separate
    # initialisers, the old ones untouched), and SignalStore moves to schema
    # v2 — `kind` is indexed in the FTS table, which requires DROPping and
    # rebuilding it. Migration runs on open and is idempotent; verified against
    # a copy of a real 62-event database.
    # Phase 3: SignalStore.markUnread / .delete, the SignalSourceRail
    # component, and SignalPresentation.sourceGroups for group-by-app.
    # Phase 3 close-out: SignalRowState.isPinned (writable since M1, readable
    # only now) and SignalFeedRow's pin glyph plus full-body expansion.
    # Phase 4: toast actions, hover-to-pause with a remaining-time hairline,
    # a dismissal that drifts toward the bell, and reduce-motion throughout.
    # Phase 5: accessibility labels on the feed row, rail and toast — severity
    # spoken first, time spoken in words, actions exposed as a11y actions.
    # Phase 5: arrow-key traversal of the feed, owned by the list, plus the
    # focus ring and Color.contrastRatio.
    # Phase 6: SignalHealth — read rate, median acknowledge, noisiest kinds,
    # all derived from columns the store already had. Nothing leaves the machine.
    # Phase 7: accessibility on the SETTINGS controls, which had none at all —
    # captioned rows name their group, segments report selection, and the
    # toggle, stepper and slider carry values. AinkradSlider was a bare
    # DragGesture with no accessibility, so it was inoperable without a
    # pointer: the notification volume could not be changed at all.
    # Additive modifiers only; abi-check clean on Contract and Signal, and
    # every plugin pin is an ancestor of this revision.
    # Phase 8: ainkradSurfaceOpacity / ainkradSurfaceBlur -- the host injects
    # Settings -> Appearance -> Overlays once at its root, and AinkradPanel
    # reads it, so a HUD surface anywhere (host or plugin) follows those
    # controls instead of a hardcoded 0.94. Both are new @Entry environment
    # values, NOT defaulted init parameters, so no existing symbol is
    # re-mangled -- the d5d994b failure. Plus hover and selection motion on
    # SignalSourceRail.
    #
    # Phase 9: AinkradMenuButton -- a left-click pull-down drawn in the app's
    # own language. SwiftUI's `Menu` renders a stock AppKit menu, which sat
    # inside the HUD looking like another application; the kit already drew a
    # correct menu but only right-click could reach it. Also carries the two
    # surface values across the floating panel's window boundary, without
    # which a menu ignored Appearance -> Overlays while every panel around it
    # obeyed. Purely additive: one new public type, nothing removed.
    #
    # 0.17.2: urgent notifications are audible. `.urgent` promised "never
    # silent" and inserted only a toast/banner and a badge -- sound comes from
    # the severity table, where only `.failure` earns one, so an agent BLOCKED
    # on the user (`.info` severity, nothing has gone wrong) raised a toast and
    # made no sound. Behaviour-only: the AinkradSignal public surface is
    # byte-identical to e264efb.
    #
    # Pin safety, checked by hand because `make abi-check` covers only
    # AinkradAppKitContract and AinkradSignal, NOT AinkradAppKitUI where this
    # change lives: the public-declaration diff over AinkradAppKitUI between
    # 189d30f and 1601f08 is EMPTY -- nothing removed, nothing re-mangled --
    # so a plugin pinned behind this still loads.
    #
    # Merge of feat/ainkrad-log into development: the shared AinkradLog
    # subsystem, plus the motion budget itself -- AinkradMotionBudget (the
    # decision type, priority invisible > inactive > lowPower/reduceMotion),
    # ainkradMotionBudgetSource() (the @Environment observer the host attaches
    # once at its root), and BudgetedTimelineView (replaces
    # TimelineView(.animation) at decorative call sites, capping their redraw
    # rate to the budget instead of display refresh rate). Additive only --
    # abi-check clean on AinkradAppKitContract and AinkradSignal, generation
    # unchanged.
    revision: 91ed630a24dc187f8988c104d16a640d3ee7562c

targets:
  AinkradHostRuntime:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AinkradHostRuntime
    dependencies:
      # Needed for the plugin runtime's own types (RegisteredApp, HostServicesImpl,
      # PluginValidator delegation, etc). link:true to resolve symbols into this
      # static archive; embed:false — only the app target embeds the one dynamic
      # copy of AinkradAppKit, so a second copy never ships inside the app bundle.
      - package: AinkradAppKit
        link: true
        embed: false

  Ainkrad:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ainkrad
    dependencies:
      # The shared plugin runtime (loader, RegisteredApp, HostServicesImpl,
      # theming/persistence/AgentKit hubs it depends on) — see Sources/AinkradHostRuntime.
      - target: AinkradHostRuntime
      # The host EMBEDS the one dynamic copy of AinkradAppKit into
      # Contents/Frameworks. Without embedding, a standalone .app crashes at
      # launch (dyld: "@rpath/AinkradAppKit.framework … no such file") — it only
      # resolved in dev via SwiftPM's build-tree PackageFrameworks rpath. Plugin
      # bundles link the same install name with embed:false and reuse this
      # already-loaded image at runtime.
      - package: AinkradAppKit
        embed: true
        link: true
      # WebKit backs the ONE approved web surface in the app — the mermaid
      # diagram renderer in CanvasDiagramView (Task 10). Everything else
      # stays native SwiftUI per the Cardinal HUD design language.
      - sdk: WebKit.framework
      - sdk: MetricKit.framework
      # AVKit must be linked EXPLICITLY. Scry's video/audio elements use SwiftUI's
      # `VideoPlayer`, which autolinks only the `_AVKit_SwiftUI` shim — that shim's
      # `VideoPlayerView` subclasses AVKit's ObjC `AVPlayerView`, so without AVKit
      # in the load commands the Swift runtime aborts the moment a VideoPlayer is
      # built ("failed to demangle superclass ... 'So12AVPlayerViewC'").
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.app
        MARKETING_VERSION: "0.18.0"
        CURRENT_PROJECT_VERSION: "18"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ainkrad uses the microphone for push-to-talk dictation to the Assistant."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Ainkrad transcribes your dictation on-device by default."
        ENABLE_PREVIEWS: YES
        # Required for plugin loading under the hardened runtime — see the
        # comment in config/Ainkrad.entitlements. Without it, a Developer-ID
        # signed release loads zero plugins.
        CODE_SIGN_ENTITLEMENTS: config/Ainkrad.entitlements

  AinkradTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AinkradTests
    dependencies:
      - target: Ainkrad
        embed: false
      # AinkradHostRuntime is a STATIC library, unlike the AinkradAppKit
      # package below: its object code is baked directly into the Ainkrad
      # binary at build time (one copy, no separate loadable image). Tests
      # already resolve its symbols through that one copy via -bundle_loader
      # (Ainkrad launcher -> Ainkrad.debug.dylib), exactly as when these files
      # lived directly in the Ainkrad target. `link: false` here only gets
      # the target-dependency build order + the .swiftmodule search path so
      # `import AinkradHostRuntime` type-checks — it must NOT also link the
      # static archive a second time into this bundle, or `as? FileDocumentStore`
      # (etc.) casts between the app's copy and the test bundle's own second
      # copy of the same class fail at runtime (two distinct type descriptors
      # for what looks like one type — diagnosed via
      # LegacyUserDefaultsMigrationTests failing only under `make test`).
      - target: AinkradHostRuntime
        link: false
      # AinkradAppKit is linked here: it's a
      # separate dynamic library two hops from the test bundle's
      # -bundle_loader (Ainkrad launcher -> Ainkrad.debug.dylib ->
      # AinkradAppKit.framework), so bundle_loader symbol resolution doesn't
      # reach it — tests that reference its symbols directly (e.g.
      # PluginLoaderTests) fail to link without this. It's pure Swift (no
      # ObjC classes), so linking it again carries none of SwiftTerm's
      # duplicate-class risk.
      - package: AinkradAppKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AinkradDevHost:
    type: application
    platform: macOS
    sources:
      - path: Sources/AinkradDevHost
    dependencies:
      # The shared plugin runtime (loader, RegisteredApp, HostServicesImpl,
      # theming/persistence/AgentKit hubs it depends on) — see Sources/AinkradHostRuntime.
      # Static lib: no link:false here (that's only for TEST targets, see
      # AinkradTests's comment below) — the app target must link it normally.
      - target: AinkradHostRuntime
      # The Dev Host is a real host that will load plugins, so it must own
      # the one dynamic copy of the SDK, exactly like the `Ainkrad` target —
      # see that target's comment.
      - package: AinkradAppKit
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.devhost
        GENERATE_INFOPLIST_FILE: YES

  AinkradDevHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AinkradDevHostTests
    dependencies:
      - target: AinkradDevHost
        embed: false
      # AinkradHostRuntime is a STATIC library, already baked into the
      # AinkradDevHost binary. `link: false` here only gets the target-
      # dependency build order + the .swiftmodule search path so
      # `import AinkradHostRuntime` type-checks — it must NOT also link the
      # static archive a second time into this bundle (double-link lesson,
      # see AinkradTests's identical comment for the full story).
      - target: AinkradHostRuntime
        link: false
      # AinkradAppKit is linked here for the same reason as AinkradTests:
      # it's a separate dynamic library two hops from this bundle's
      # -bundle_loader, so tests that reference its symbols directly (e.g.
      # PluginInfoKey, PluginValidation) fail to link without this.
      - package: AinkradAppKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HelloPlugin:
    type: bundle
    platform: macOS
    sources:
      - path: Samples/HelloPlugin
    dependencies:
      # Link against the SDK's symbols (needed to resolve protocol descriptors
      # at load time) but do NOT embed a second copy of the dylib — resolve
      # the host's copy at runtime, so protocol type metadata is shared and
      # the cast succeeds.
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.hello
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Samples/HelloPlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        # Loaded into the host process: find AinkradAppKit via the host executable.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"

schemes:
  Ainkrad:
    build:
      targets:
        Ainkrad: all
        AinkradTests: [test]
        AinkradDevHostTests: [test]
        HelloPlugin: [run]
    run:
      config: Debug
    test:
      config: Debug
      # AinkradDevHostTests runs here too. It used to hang off the
      # AinkradDevHost scheme alone, so `make test` never touched it — which is
      # why a Dev Host that aborted on loading any context-publishing plugin
      # went unnoticed until someone load-verified a bundle by hand.
      targets:
        - AinkradTests
        - AinkradDevHostTests

  AinkradDevHost:
    build:
      targets:
        AinkradDevHost: all
        AinkradDevHostTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AinkradDevHostTests
